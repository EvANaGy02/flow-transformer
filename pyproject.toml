[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcap-transformer"
version = "0.1.0"
description = "Transform PCAP captures into flow and intrusion-detection datasets"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Eva Nagy" }]
keywords = ["pcap", "network-traffic", "flow", "intrusion-detection", "datasets"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "python-dateutil>=2.8",
    "pytz>=2023.3",
]

[project.optional-dependencies]
nfstream = ["nfstream"]
cicflowmeter = ["scapy>=2.6.0,<2.7"]
ownprep = ["pyshark==0.6", "scipy>=1.10,<2.0"]
nexusflowmeter = ["nexusflowmeter==0.1.5"]
all = [
    "nfstream",
    "scapy>=2.6.0,<2.7",
    "pyshark==0.6",
    "scipy>=1.10,<2.0",
    "nexusflowmeter==0.1.5",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["transforming_framework*"]

[tool.setuptools.package-data]
transforming_framework = ["features/*.txt"]
